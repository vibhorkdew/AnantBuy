name: AnantBuy CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/anantbuy-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/anantbuy-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # Checkout
      # ==================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==================================================
      # Backend Validation
      # ==================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate FastAPI Application
        working-directory: backend
        run: |
          python -c "from app.main import app; print('Backend Loaded Successfully')"

      # ==================================================
      # Frontend Validation
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build React Application
        working-directory: frontend
        run: npm run build

      # ==================================================
      # Docker Buildx
      # ==================================================
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==================================================
      # Login to GHCR
      # ==================================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # Build Backend Image
      # ==================================================
      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: anantbuy-backend:latest

      # ==================================================
      # Build Frontend Image
      # ==================================================
      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: anantbuy-frontend:latest

      # ==================================================
      # Trivy Security Scan
      # ==================================================
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: anantbuy-backend:latest
          format: table
          output: trivy-backend.txt
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: anantbuy-frontend:latest
          format: table
          output: trivy-frontend.txt
          severity: HIGH,CRITICAL
          exit-code: "0"

      # ==================================================
      # Upload Trivy Reports
      # ==================================================
      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-backend.txt
            trivy-frontend.txt

      # ==================================================
      # Push Backend Image
      # ==================================================
      - name: Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # ==================================================
      # Push Frontend Image
      # ==================================================
      - name: Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # ==================================================
      # Trigger AnantX Deployment
      # ==================================================
      - name: Trigger AnantX Deployment
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.ANANTX_DEPLOY_TOKEN }}" \
            https://api.github.com/repos/vibhorkdew/AnantX/dispatches \
            -d '{"event_type":"anantbuy-updated"}'