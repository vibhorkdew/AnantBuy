name: AnantBuy CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/anantbuy-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/anantbuy-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # Checkout
      # ==================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==================================================
      # Backend Validation
      # ==================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate FastAPI Application
        working-directory: backend
        run: |
          python -c "from app.main import app; print('Backend Loaded Successfully')"

      # ==================================================
      # Frontend Validation
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build React Application
        working-directory: frontend
        run: npm run build

      # ==================================================
      # Docker Buildx
      # ==================================================
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==================================================
      # Login to GHCR
      # ==================================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # Build & Push Backend
      # ==================================================
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # ==================================================
      # Build & Push Frontend
      # ==================================================
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}